name: Build signed AAB and APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
      KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy PDF viewer into the app
        run: npm run prepare:web

      - name: Create the Android project and icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Make sure target SDK is 36
        run: |
          sed -i -E "s/(targetSdkVersion|compileSdkVersion) = [0-9]+/\1 = 36/" android/variables.gradle
          grep -E "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle

      - name: Set version and signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jee.jks"
          echo "KS_PATH=$RUNNER_TEMP/jee.jks" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KS_ALIAS")
                      keyPassword System.getenv("KS_KEYPASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed AAB and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload AAB (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK (for manual testing)
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
